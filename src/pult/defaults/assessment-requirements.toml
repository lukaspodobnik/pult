# Ausgangswerte für das bayerische G9 ab 2026/27, je Schuljahr.
# Schulaufgaben: GSO § 22; kleine LNWs Q13/gA: § 21 Abs. 3 (schriftlich in 13/2).
# https://www.gesetze-bayern.de/Content/Document/BayGSO-22
# https://www.gesetze-bayern.de/Content/Document/BayGSO-21
# Informatik bis 11: konfigurierbarer Schulstandard von 2 kleinen schriftlichen
# LNWs pro Jahr, keine Behauptung einer landesweiten gesetzlichen Mindestzahl.
# Fehlende Kategorie in minimums = keine Mindestvorgabe, ausdrücklich 0 ist möglich.
# Erlaubte Arten sind unabhängig davon. JST zählen niemals zu den Mindestzahlen.
# Keine Halbjahresprüfung. Schulische Ersatzregelungen sind hier nicht abgebildet.

