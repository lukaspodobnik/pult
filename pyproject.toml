[project]
name = "pult"
version = "0.1.0"
description = "Lokaler Unterrichtsplaner für das Terminal: Sequenzen, Stundenplan und Unterrichtsprotokoll."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "COPYRIGHT", "SOURCES.md"]
authors = [
    { name = "Lukas Podobnik", email = "lukas.podobnik@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "textual>=8.2.8",
    "tomli-w>=1.2.0",
]

[project.scripts]
pult = "pult:main"

[project.urls]
Homepage = "https://github.com/lukaspodobnik/pult"
Repository = "https://github.com/lukaspodobnik/pult"
Issues = "https://github.com/lukaspodobnik/pult/issues"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
